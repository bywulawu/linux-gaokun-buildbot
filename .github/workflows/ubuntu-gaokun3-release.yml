name: Build Image - Ubuntu Gaokun3

on:
  workflow_dispatch:
    inputs:
      ubuntu_release:
        description: Ubuntu release version (e.g. 26.04, 24.04.4)
        required: true
        default: "26.04"
      kernel_tag:
        description: Linux kernel tag
        required: true
        default: "v7.2.5"
      desktop_environment:
        description: Desktop environment metapackage
        required: true
        default: "ubuntu-desktop-minimal"
      extra_packages:
        description: Extra packages to install (space-separated)
        required: true
        # mutter 随 gnome-shell 必装无需显式列；rsync 仅构建机需要（host deps 已装）；
        # git/vim/ripgrep/v4l-utils/screen 属开发调试工具，需要时进系统自行安装
        default: "language-pack-gnome-zh-hans ibus-libpinyin firefox systemd-zram-generator gnome-tweaks gnome-shell-extension-manager mpv htop nano"
      build_el2:
        description: Build and include optional -gaokun3-el2 kernel and EL2 EFI payloads
        required: true
        default: false
        type: boolean
      rebuild_package_debs:
        description: Rebuild gaokun package DEBs before image build
        required: true
        default: false
        type: boolean

permissions:
  contents: write

# 同一分支/标签上的重跑只排队不互相取消：镜像构建是长任务，中途取消会浪费已完成的作业。
# 组名必须用固定字面量而非 github.workflow：本工作流会通过 workflow_call 调用
# gaokun3-package-debs，而可复用工作流里 github.workflow 继承的是调用方名字，
# 两边用 github.workflow 会解析出同一组名，触发 "deadlock between a top level
# workflow and build-package-debs" 死锁取消
concurrency:
  group: ubuntu-gaokun3-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-package-debs:
    if: ${{ github.event.inputs.rebuild_package_debs == 'true' }}
    uses: ./.github/workflows/gaokun3-package-debs.yml
    with:
      kernel_tag: ${{ github.event.inputs.kernel_tag }}
      build_el2: ${{ github.event.inputs.build_el2 == 'true' }}
    # 不用 secrets: inherit: 被调工作流只需要自动提供的 GITHUB_TOKEN,
    # inherit 会把仓库全部 secret 暴露进其执行环境

  build-and-release:
    needs: build-package-debs
    if: ${{ !cancelled() && (needs.build-package-debs.result == 'success' || needs.build-package-debs.result == 'skipped') }}
    runs-on: ubuntu-24.04-arm
    # rootfs 下载解包 + 桌面安装 + 镜像打包, 常规 1 小时内; 显式超时防挂死占满 6 小时
    timeout-minutes: 240
    env:
      TZ: UTC
      UBUNTU_RELEASE: ${{ github.event.inputs.ubuntu_release }}
      KERNEL_TAG: ${{ github.event.inputs.kernel_tag }}
      DESKTOP_ENVIRONMENT: ${{ github.event.inputs.desktop_environment }}
      EXTRA_PACKAGES: ${{ github.event.inputs.extra_packages }}
      BUILD_EL2: ${{ github.event.inputs.build_el2 }}
      IMAGE_SIZE: 12G # 兜底值；实际由 "Compute image size" 步骤按 rootfs 用量动态覆盖
      IMAGE_CHUNK_SIZE: 1900M
      ZSTD_LEVEL: 15 # -19 极慢；-15 压缩率基本持平，速度快约一倍
      GAOKUN_DIR: ${{ github.workspace }}
      WORKDIR: ${{ github.workspace }}/build-ubuntu
      ROOTFS_DIR: ${{ github.workspace }}/build-ubuntu/rootfs
      ARTIFACT_DIR: ${{ github.workspace }}/build-ubuntu/artifacts
      PACKAGE_DEBS_DIR: ${{ github.workspace }}/build-ubuntu/package-debs
      IMAGE_FILE: ${{ github.workspace }}/build-ubuntu/ubuntu-${{ github.event.inputs.ubuntu_release }}-gaokun3.img

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install host dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            rsync kmod curl jq gnupg \
            parted dosfstools e2fsprogs zstd xz-utils python3

      # 解析包发布 tag（未随本次运行重建时）并下载 manifest + DEB
      - name: Fetch gaokun package DEBs
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          mkdir -p "$WORKDIR" "$ROOTFS_DIR" "$ARTIFACT_DIR" "$PACKAGE_DEBS_DIR"

          # GitHub API 认证 GET
          api() {
            curl -fsSL \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "$@"
          }

          # 按附件名从 release JSON 解析下载地址并下载，缺失即失败。
          # 两段式下载: API 会 302 到 objects.githubusercontent.com, 先取带签名的
          # 重定向地址再不带 Authorization 下载, 避免 token 被重放到 GitHub 之外的主机
          download_asset() {
            local name="$1"
            local out="$2"
            local url redirect_url
            url="$(jq -r --arg name "$name" '.assets[] | select(.name == $name) | .url' "$release_json")"
            if [[ -z "$url" || "$url" == "null" ]]; then
              echo "missing asset ${name} in release ${PACKAGE_RELEASE_TAG}" >&2
              exit 1
            fi
            redirect_url="$(curl -fsSI -o /dev/null -w '%{redirect_url}' \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Accept: application/octet-stream" \
              "$url")"
            if [[ -n "$redirect_url" && "$redirect_url" != "null" ]]; then
              curl -fsSL "$redirect_url" -o "$out"
            else
              curl -fsSL \
                -H "Authorization: Bearer ${GITHUB_TOKEN}" \
                -H "Accept: application/octet-stream" \
                "$url" -o "$out"
            fi
          }

          if [[ "${{ github.event.inputs.rebuild_package_debs }}" != "true" ]]; then
            # 未重建：按 kernel tag + profile 前缀取最近一次包发布
            safe_kernel_tag="${KERNEL_TAG//\//-}"
            safe_kernel_tag="${safe_kernel_tag//[^A-Za-z0-9._-]/-}"
            profile="std"
            [[ "$BUILD_EL2" == "true" ]] && profile="std-el2"
            prefix="gaokun3-debs-${safe_kernel_tag}-${profile}-"

            releases_json="$WORKDIR/releases.json"
            # 分页检索: 每次构建都新增带时间戳的包发布, 固定取前 100 条会漏掉旧 tag
            PACKAGE_RELEASE_TAG=""
            for page in 1 2 3; do
              api "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases?per_page=100&page=$page" -o "$releases_json"
              PACKAGE_RELEASE_TAG="$(jq -r --arg prefix "$prefix" '.[] | select(.tag_name | startswith($prefix)) | .tag_name' "$releases_json" | head -n 1)"
              [[ -n "$PACKAGE_RELEASE_TAG" ]] && break
              (( $(jq length "$releases_json") < 100 )) && break
            done
            if [[ -z "$PACKAGE_RELEASE_TAG" ]]; then
              echo "no package release found for prefix ${prefix}" >&2
              exit 1
            fi
          else
            # 本次已重建：直接用上游 job 产出的 tag
            PACKAGE_RELEASE_TAG="${{ needs.build-package-debs.outputs.package_release_tag }}"
          fi

          release_json="$WORKDIR/package-release.json"
          api "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${PACKAGE_RELEASE_TAG}" -o "$release_json"

          manifest_path="$PACKAGE_DEBS_DIR/package-manifest.json"
          download_asset package-manifest.json "$manifest_path"

          manifest_kernel_tag="$(jq -r '.kernel_tag' "$manifest_path")"
          if [[ "$manifest_kernel_tag" != "$KERNEL_TAG" ]]; then
            echo "package release kernel tag mismatch: expected ${KERNEL_TAG}, got ${manifest_kernel_tag}" >&2
            exit 1
          fi
          # 同源校验: kernel.release 字符串不变不代表包没变(patches/firmware 都可能改过),
          # 复用的包必须与本次镜像同一 commit 构建
          manifest_commit="$(jq -r '.commit_sha // empty' "$manifest_path")"
          if [[ -n "$manifest_commit" && "$manifest_commit" != "unknown" && "$manifest_commit" != "$GITHUB_SHA" ]]; then
            echo "package release was built from commit ${manifest_commit}, but this run is ${GITHUB_SHA}" >&2
            echo "stale packages may silently differ (patches/firmware changed); rerun with rebuild_package_debs=true" >&2
            exit 1
          fi
          if [[ "$BUILD_EL2" == "true" && "$(jq -r '.build_el2' "$manifest_path")" != "true" ]]; then
            echo "package release ${PACKAGE_RELEASE_TAG} does not contain EL2 packages" >&2
            exit 1
          fi

          deb_jq_paths=(
            '.kernels.standard.packages.image'
            '.kernels.standard.packages.modules'
            '.packages.firmware'
          )
          [[ "$BUILD_EL2" == "true" ]] && deb_jq_paths+=('.kernels.el2.packages.image' '.kernels.el2.packages.modules')

          for jq_path in "${deb_jq_paths[@]}"; do
            raw_name="$(jq -r "$jq_path" "$manifest_path")"
            # GitHub Release 附件名不能含 '~'，上传时会被自动替换为 '.'
            download_asset "${raw_name//\~/.}" "$PACKAGE_DEBS_DIR/$raw_name"
          done

      - name: Bootstrap Ubuntu rootfs
        run: |
          set -euxo pipefail
          cleanup() {
            set +e
            sudo umount "$ROOTFS_DIR/dev/pts" 2>/dev/null || true
            sudo umount "$ROOTFS_DIR/dev" 2>/dev/null || true
            sudo umount "$ROOTFS_DIR/proc" 2>/dev/null || true
            sudo umount "$ROOTFS_DIR/sys" 2>/dev/null || true
            sudo umount "$ROOTFS_DIR/run" 2>/dev/null || true
            sudo rm -f "$ROOTFS_DIR/etc/resolv.conf"
            sudo mv "$ROOTFS_DIR/etc/resolv.conf.bak" "$ROOTFS_DIR/etc/resolv.conf"
          }
          trap cleanup EXIT

          # Download and extract ubuntu-base as rootfs foundation
          UBUNTU_BASE_URL="https://cdimages.ubuntu.com/ubuntu-base/releases/${UBUNTU_RELEASE}/release/ubuntu-base-${UBUNTU_RELEASE}-base-arm64.tar.gz"
          UBUNTU_BASE_BETA_URL="https://cdimages.ubuntu.com/ubuntu-base/releases/${UBUNTU_RELEASE}/beta/ubuntu-base-${UBUNTU_RELEASE}-beta-base-arm64.tar.gz"
          UBUNTU_BASE_TAR="$WORKDIR/ubuntu-base-arm64.tar.gz"

          if ! curl -fsSL -o "$UBUNTU_BASE_TAR" "$UBUNTU_BASE_URL"; then
            echo "Release tarball not found, trying beta..."
            curl -fsSL -o "$UBUNTU_BASE_TAR" "$UBUNTU_BASE_BETA_URL"
          fi

          sudo tar -xzf "$UBUNTU_BASE_TAR" -C "$ROOTFS_DIR"

          sudo mv "$ROOTFS_DIR/etc/resolv.conf" "$ROOTFS_DIR/etc/resolv.conf.bak"
          sudo cp /run/systemd/resolve/resolv.conf "$ROOTFS_DIR/etc/resolv.conf"

          # mozilla apt 仓库（Firefox deb）：密钥与 sources 在 host 侧预先写入 rootfs，
          # chroot 内只需一次 apt-get update 即可同时解析 Ubuntu 官方与 mozilla 仓库
          curl -fsSL https://packages.mozilla.org/apt/repo-signing-key.gpg | \
            gpg --dearmor -o "$WORKDIR/packages.mozilla.org.gpg"
          sudo install -Dm644 "$WORKDIR/packages.mozilla.org.gpg" \
            "$ROOTFS_DIR/etc/apt/keyrings/packages.mozilla.org.gpg"

          printf "%s\n" \
            "deb [signed-by=/etc/apt/keyrings/packages.mozilla.org.gpg] https://packages.mozilla.org/apt mozilla main" \
            | sudo tee "$ROOTFS_DIR/etc/apt/sources.list.d/mozilla.list" >/dev/null

          printf "%s\n" \
            "Package: *" \
            "Pin: origin packages.mozilla.org" \
            "Pin-Priority: 1000" \
            | sudo tee "$ROOTFS_DIR/etc/apt/preferences.d/mozilla" >/dev/null

          sudo mount --bind /dev "$ROOTFS_DIR/dev"
          sudo mount --bind /dev/pts "$ROOTFS_DIR/dev/pts"
          sudo mount -t proc proc "$ROOTFS_DIR/proc"
          sudo mount -t sysfs sys "$ROOTFS_DIR/sys"
          sudo mount -t tmpfs tmpfs "$ROOTFS_DIR/run"

          # 交互变量通过 env 传入 chroot，避免在单引号脚本里做引号拼接
          sudo chroot "$ROOTFS_DIR" /usr/bin/env \
            UBUNTU_RELEASE="$UBUNTU_RELEASE" \
            DESKTOP_ENVIRONMENT="$DESKTOP_ENVIRONMENT" \
            EXTRA_PACKAGES="$EXTRA_PACKAGES" \
            /bin/bash -euxo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive

              apt-get update
              apt-get install -y locales
              sed -i "s/# zh_CN.UTF-8/zh_CN.UTF-8/" /etc/locale.gen
              locale-gen
              update-locale LANG=zh_CN.UTF-8 LANGUAGE=zh_CN:en_US:en LC_MESSAGES=zh_CN.UTF-8

              apt-get install -y linux-base initramfs-tools kmod
              apt-get install -y --no-install-recommends systemd-boot systemd-boot-efi

              # Base system tools (not user-configurable)
              apt-get install -y \
                iputils-ping iproute2 net-tools dnsutils traceroute \
                xz-utils unzip zip bzip2 zstd p7zip-full \
                wget curl ca-certificates gnupg lsb-release \
                ssh less file sudo

              # dconf-cli: required by the image configuration step (dconf update writes screen-keyboard defaults)
              apt-get install -y dconf-cli

              apt-get install -y \
                "$DESKTOP_ENVIRONMENT" \
                fonts-noto-cjk fonts-noto-color-emoji \
                gstreamer1.0-libav gstreamer1.0-plugins-ugly \
                alsa-utils pipewire-alsa \
                $EXTRA_PACKAGES

              if dpkg --compare-versions "${UBUNTU_RELEASE}" gt "25.10"; then
                # We use ptyxis instead of gnome-terminal
                apt purge --auto-remove -y gnome-terminal
              fi
              apt-get clean
            '

          cleanup
          trap - EXIT

      - name: Install gaokun package DEBs into rootfs
        run: |
          set -euxo pipefail
          manifest_path="$PACKAGE_DEBS_DIR/package-manifest.json"

          kernel_release="$(jq -r '.kernels.standard.release' "$manifest_path")"
          echo "$kernel_release" > "$WORKDIR/kernel-release.txt"

          deb_names=(
            "$(jq -r '.kernels.standard.packages.image' "$manifest_path")"
            "$(jq -r '.kernels.standard.packages.modules' "$manifest_path")"
            "$(jq -r '.packages.firmware' "$manifest_path")"
          )
          kernel_releases=("$kernel_release")

          if [[ "$BUILD_EL2" == "true" ]]; then
            el2_kernel_release="$(jq -r '.kernels.el2.release' "$manifest_path")"
            echo "$el2_kernel_release" > "$WORKDIR/kernel-release-el2.txt"
            deb_names+=(
              "$(jq -r '.kernels.el2.packages.image' "$manifest_path")"
              "$(jq -r '.kernels.el2.packages.modules' "$manifest_path")"
            )
            kernel_releases+=("$el2_kernel_release")
          else
            rm -f "$WORKDIR/kernel-release-el2.txt"
          fi

          for deb_name in "${deb_names[@]}"; do
            sudo cp "$PACKAGE_DEBS_DIR/$deb_name" "$ROOTFS_DIR/tmp/"
          done

          sudo mount --bind /dev "$ROOTFS_DIR/dev"
          sudo mount --bind /dev/pts "$ROOTFS_DIR/dev/pts"
          sudo mount -t proc proc "$ROOTFS_DIR/proc"
          sudo mount -t sysfs sys "$ROOTFS_DIR/sys"
          sudo mount -t tmpfs tmpfs "$ROOTFS_DIR/run"
          # 与 Bootstrap 步骤相同: 失败也要保证挂载被清理, 单条 umount 失败不能杀死整单
          deb_mount_cleanup() {
            set +e
            sudo umount "$ROOTFS_DIR/dev/pts" 2>/dev/null || true
            sudo umount "$ROOTFS_DIR/dev" 2>/dev/null || true
            sudo umount "$ROOTFS_DIR/proc" 2>/dev/null || true
            sudo umount "$ROOTFS_DIR/sys" 2>/dev/null || true
            sudo umount "$ROOTFS_DIR/run" 2>/dev/null || true
          }
          trap deb_mount_cleanup EXIT

          # DEB 文件名不含空白，容器内靠分词展开
          chroot_debs="$(printf ' /tmp/%s' "${deb_names[@]}")"
          sudo chroot "$ROOTFS_DIR" /usr/bin/env \
            CHROOT_DEBS="$chroot_debs" \
            KERNEL_RELEASES="${kernel_releases[*]}" \
            /bin/bash -euxo pipefail -c '
              dpkg -i $CHROOT_DEBS
              rm -f /tmp/*.deb
              for krel in $KERNEL_RELEASES; do
                depmod -a "$krel"
              done
            '

          deb_mount_cleanup
          trap - EXIT

      - name: Slim rootfs (remove caches, logs, docs before imaging)
        run: |
          set -euxo pipefail
          sudo find "$ROOTFS_DIR/usr/share/doc" -type f \( -name '*.gz' -o -name 'changelog*' -o -name 'copyright' \) -delete 2>/dev/null || true
          sudo find "$ROOTFS_DIR/usr/share/man" -type f \( -name '*.gz' -o -name '*.bz2' \) -delete 2>/dev/null || true
          sudo rm -rf \
            "$ROOTFS_DIR/var/lib/apt/lists" \
            "$ROOTFS_DIR/var/log/apt" \
            "$ROOTFS_DIR/var/log/journal"
          # 注意: find -delete 会把子目录连目录一起删掉（/var/cache/apt、/var/cache/swcatalog
          # 等都会消失），并非只清空内容。/tmp、/var/tmp 本身保留即可；aptdaemon 依赖的
          # /var/lib/apt/lists/partial、/var/cache/apt/archives/partial 等锁/下载目录由镜像
          # chroot（scripts/ci/50_make_image_ubuntu.sh）在打包前按发行版原始属主统一重建
          sudo find "$ROOTFS_DIR/tmp" "$ROOTFS_DIR/var/tmp" "$ROOTFS_DIR/var/cache" -mindepth 1 -delete 2>/dev/null || true
          sudo du -sh "$ROOTFS_DIR"

      - name: Compute image size from rootfs usage
        run: |
          set -euxo pipefail
          used_kib="$(sudo du -sk "$ROOTFS_DIR" | cut -f1)"
          # rootfs 用量 + ext4 元数据余量 10% + 2GiB 冗余 + 1GiB ESP，向上取整到 GiB，下限 8G
          want_bytes=$(( (used_kib * 1024 / 10 + used_kib * 1024 + 2 * 1024 * 1024 * 1024 + 1024 * 1024 * 1024 + (1024 * 1024 * 1024 - 1)) / (1024 * 1024 * 1024) * 1024 * 1024 * 1024 ))
          want_gib=$(( want_bytes / 1024 / 1024 / 1024 ))
          if (( want_gib < 8 )); then
            want_gib=8
          fi
          echo "IMAGE_SIZE=${want_gib}G" >> "$GITHUB_ENV"
          echo "image size: ${want_gib}G (rootfs usage: $(( used_kib / 1024 ))MiB)"

      - name: Create disk image and configure boot
        run: scripts/ci/50_make_image_ubuntu.sh

      # 镜像 rootfs 分区已写完, 后续打包只读 IMAGE_FILE; rootfs(7-8G)继续留着会推高
      # 峰值占用, ARM runner 磁盘紧张(package 工作流已踩过 ENOSPC)
      - name: Free disk space before packaging
        run: |
          set -euxo pipefail
          sudo rm -rf "$ROOTFS_DIR"
          df -h /

      # 输出 tag_name / kernel_release / package_glob 到 GITHUB_OUTPUT
      - name: Package image and generate release info
        id: package
        run: scripts/ci/60_package_release_ubuntu.sh

      - name: Upload build artifacts (workflow)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ubuntu-gaokun3-build
          compression-level: 0 # .zst 已是压缩数据，跳过 zip 打包的重复压缩
          path: ${{ env.ARTIFACT_DIR }}/${{ steps.package.outputs.package_glob }}

      - name: Create GitHub Release
        # 固定到 v3 的具体 commit: 该 action 持有 contents:write, 不用可变标签
        uses: softprops/action-gh-release@5113cdc90fd4d541c801c55356214017bf5ae34b # v3
        with:
          tag_name: ${{ steps.package.outputs.tag_name }}
          name: Ubuntu ${{ env.UBUNTU_RELEASE }} - gaokun3 - ${{ steps.package.outputs.kernel_release }}
          body_path: ${{ env.ARTIFACT_DIR }}/release-body.md
          files: ${{ env.ARTIFACT_DIR }}/${{ steps.package.outputs.package_glob }}
